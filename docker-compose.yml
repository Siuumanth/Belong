services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: belong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: belong
      POSTGRES_USER: belong_user
      POSTGRES_PASSWORD: belong_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./belong-api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belong_user -d belong"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: belong-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: belong
      RABBITMQ_DEFAULT_PASS: belong_password

volumes:
  postgres_data:
    name: belong_postgres_data

