services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: belong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: belong
      POSTGRES_USER: belong_user
      POSTGRES_PASSWORD: belong_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./python-belong/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belong_user -d belong"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: belong_postgres_data
