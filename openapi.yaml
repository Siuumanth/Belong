openapi: 3.1.0
info:
  title: Belong Platform API
  description: >
    Public and internal API specification for the Belong compatibility matching platform.
    Requests are routed via the Go API Gateway (:9000), which proxies authentication requests
    to the Go Auth Service (:9001) and domain requests to the Python Belong Service (:8000).
  version: 1.0.0
servers:
  - url: http://localhost:9000
    description: Go API Gateway (Primary Client Entrypoint)
  - url: http://localhost:9001
    description: Go Auth Service (Direct Internal)
  - url: http://localhost:8000
    description: Python Belong FastAPI Service (Direct Internal)

paths:
  # ==========================================
  # GATEWAY SYSTEM ENDPOINTS
  # ==========================================
  /health:
    get:
      summary: Gateway Health Check
      description: Returns health status of the Go API Gateway.
      tags: [System]
      responses:
        '200':
          description: Gateway is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "go-gateway" }

  # ==========================================
  # AUTH SERVICE ENDPOINTS (/auth/*)
  # ==========================================
  /auth/signup:
    post:
      summary: Register a New User
      description: Creates user credentials and stores them in the Auth DB.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "user created" }
        '400':
          $ref: '#/components/responses/BadRequestError'

  /auth/login:
    post:
      summary: Authenticate User
      description: Verifies password and returns a signed JWT containing user claims.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==========================================
  # PROFILE ENDPOINTS (/profiles/*)
  # ==========================================
  /profiles:
    post:
      summary: Create Profile
      description: Creates the initial structured profile and deterministic search filters for a user.
      tags: [Profiles]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /profiles/{user_id}:
    get:
      summary: Get Profile by User ID
      description: Retrieves the complete profile, including deterministic attributes, JSONB signals, and extraction metadata.
      tags: [Profiles]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      summary: Update Profile
      description: Partially updates deterministic fields or profile JSONB. Enqueues an embedding re-generation job if relevant traits change.
      tags: [Profiles]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'

  /profiles/{user_id}/embeddings:
    post:
      summary: Enqueue Profile Embedding Generation Job
      description: Creates an asynchronous embedding job in PostgreSQL, publishes it to RabbitMQ, and returns HTTP 202 Accepted with job metadata.
      tags: [Profiles]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Embedding job enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

    get:
      summary: Get Profile Embedding Status & Source Text
      description: Returns boolean indicators for vector presence (`has_self_embedding`, `has_wants_embedding`), canonical source text, and update timestamp.
      tags: [Profiles]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Embedding status retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  has_self_embedding: { type: boolean, example: true }
                  has_wants_embedding: { type: boolean, example: true }
                  embedding_source_text: { type: object }
                  updated_at: { type: string, format: date-time }
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ==========================================
  # ONBOARDING ENDPOINTS (/onboarding/*)
  # ==========================================
  /onboarding/session:
    post:
      summary: Start Onboarding Conversation
      description: Initializes a new LangGraph onboarding dialogue session and returns the first core question.
      tags: [Onboarding]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '201':
          description: Conversation session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSessionResponse'

  /onboarding/message:
    post:
      summary: Send Onboarding Answer
      description: Submits user response, executes LangGraph signal extraction, tests for contradictions, and asks adaptive follow-ups (max 2).
      tags: [Onboarding]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingMessageRequest'
      responses:
        '200':
          description: Step processed. Returns next question or indicates completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingMessageResponse'

  /onboarding/{conversation_id}:
    get:
      summary: Get Onboarding State
      description: Fetches full message transcript and current LangGraph checkpoint state.
      tags: [Onboarding]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transcript and status retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStateResponse'

  # ==========================================
  # MATCHING ENDPOINTS (/matches/*)
  # ==========================================

  # 1. FIND MATCHES (Stage 1 Candidate Match Retrieval)
  /matches/candidates/{user_id}:
    get:
      summary: Find Candidate Matches (Stage 1 Retrieval)
      description: Fast retrieval of top-K candidate matches using SQL hard constraints + pgvector similarity search. Does NOT invoke LLM reasoning.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: candidate_pool_limit
          in: query
          required: false
          schema: { type: integer, example: 50 }
        - name: pre_rank_limit
          in: query
          required: false
          schema: { type: integer, example: 15 }
        - name: max_distance_km
          in: query
          required: false
          schema: { type: integer, example: 100 }
      responses:
        '200':
          description: Candidate matches retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalListResponse'

  /matches/candidates:
    post:
      summary: Find Candidate Matches (POST Variant)
      description: Fast Stage 1 candidate retrieval with custom configuration payload or X-User-ID header.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalOptions'
      responses:
        '200':
          description: Candidate matches retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalListResponse'

  /matches/retrieval/{user_id}:
    get:
      summary: Alias for Stage 1 Candidate Retrieval
      description: Alias endpoint for Stage 1 candidate match retrieval.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Candidate matches retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalListResponse'

  # 2. ANALYZE DEEPER (Stage 2 On-Demand LLM Matchmaking)
  /matches/analyze:
    post:
      summary: Analyze Candidate Deeper (Stage 2 LLM Matchmaking)
      description: Runs on-demand LangGraph LLM pairwise reasoning for a selected candidate, persists the result in compatibility_results, and returns the detailed qualitative breakdown.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeMatchRequest'
      responses:
        '200':
          description: Deep qualitative compatibility analysis generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCandidateResponse'

  /matches/analyze/{candidate_user_id}:
    post:
      summary: Analyze Candidate Deeper by Candidate ID
      description: Runs on-demand LLM pairwise reasoning for the specified candidate_user_id path parameter.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: candidate_user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deep qualitative compatibility analysis generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCandidateResponse'

  # 3. GET COMPLETED / PERSISTED MATCHES
  /matches/{user_id}:
    get:
      summary: Get Latest Persisted Matches
      description: Reads the most recently completed pairwise compatibility results for a given user from the database.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Persisted matches list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesListResponse'

  /matches/details/pair/{candidate_user_id}:
    get:
      summary: Get Detailed Match Analysis for Candidate Pair
      description: Retrieves existing full detailed qualitative compatibility analysis for a specific candidate user pair.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: candidate_user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detailed match analysis found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCandidateResponse'

  /matches/details/{result_id}:
    get:
      summary: Get Detailed Match Analysis by Result ID
      description: Retrieves full detailed qualitative compatibility analysis for a specific match result UUID.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: result_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detailed match analysis found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCandidateResponse'

  # 4. ASYNC BATCH JOBS
  /matches:
    post:
      summary: Create Async Matching Batch Job
      description: Enqueues an asynchronous batch matching job (SQL Hard Filters + pgvector Recall + Pairwise LLM Reasoning). Returns HTTP 202 immediately.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: X-User-ID
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                limit: { type: integer, default: 5, example: 5 }
      responses:
        '202':
          description: Job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'

  /matches/jobs/{job_id}:
    get:
      summary: Get Matching Job Status
      description: Polls the state of an asynchronous matching job.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

  /matches/jobs/{job_id}/results:
    get:
      summary: Get Matching Job Results
      description: Retrieves qualitative compatibility breakdowns generated by a specific matching job run.
      tags: [Matching]
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Matching job results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesListResponse'


# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Invalid payload or bad request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "Invalid input parameters" }
    UnauthorizedError:
      description: Missing or invalid JWT token.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "Unauthorized" }
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "Resource not found" }

  schemas:
    # Auth
    SignUpRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: "alex_rivers" }
        email: { type: string, format: email, example: "alex@example.com" }
        password: { type: string, format: password, example: "SecurePass123!" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "alex@example.com" }
        password: { type: string, format: password, example: "SecurePass123!" }

    AuthResponse:
      type: object
      properties:
        token: { type: string, example: "eyJhbGciOiJIUzI1NiIsInR5cCI6..." }
        username: { type: string, example: "alex_rivers" }
        email: { type: string, example: "alex@example.com" }

    # Profile
    ProfileCreate:
      type: object
      required: [user_id, age, gender, orientation, relationship_goal]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, example: "Alice" }
        age: { type: integer, example: 25 }
        gender: { type: string, example: "woman" }
        orientation: { type: string, example: "heterosexual" }
        latitude: { type: number, format: double, example: 37.7749 }
        longitude: { type: number, format: double, example: -122.4194 }
        relationship_goal: { type: string, example: "long-term" }
        preferred_age_min: { type: integer, example: 24 }
        preferred_age_max: { type: integer, example: 30 }
        max_distance_km: { type: integer, example: 25 }
        preferred_genders:
          type: array
          items: { type: string }
          example: ["man"]
        profile:
          type: object
          description: Structured profile signals (self, wants, constraints)

    ProfileUpdate:
      type: object
      properties:
        name: { type: string, example: "Alice" }
        age: { type: integer }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        relationship_goal: { type: string }
        preferred_age_min: { type: integer }
        preferred_age_max: { type: integer }
        max_distance_km: { type: integer }
        preferred_genders:
          type: array
          items: { type: string }
        profile: { type: object }

    ProfileResponse:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, example: "Alice" }
        age: { type: integer }
        gender: { type: string }
        orientation: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        relationship_goal: { type: string }
        preferred_age_min: { type: integer }
        preferred_age_max: { type: integer }
        max_distance_km: { type: integer }
        preferred_genders: { type: array, items: { type: string } }
        profile: { type: object }
        extraction_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # Onboarding
    OnboardingSessionResponse:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        question_id: { type: string, example: "q1_relationship_goal" }
        message: { type: string, example: "What are you looking for in a relationship right now?" }

    OnboardingMessageRequest:
      type: object
      required: [conversation_id, message]
      properties:
        conversation_id: { type: string, format: uuid }
        message: { type: string, example: "I am looking for a serious partnership where we support each other's passions." }

    OnboardingMessageResponse:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, completed], example: "in_progress" }
        question_id: { type: string, nullable: true, example: "q2_emotional_needs" }
        message: { type: string, example: "What do you most need from a partner when things get stressful?" }

    OnboardingStateResponse:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, example: "completed" }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string, example: "user" }
              content: { type: string }
              question_id: { type: string, nullable: true }
              created_at: { type: string, format: date-time }

    # Matching Schemas
    JobAcceptedResponse:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, example: "matching" }
        status: { type: string, example: "pending" }
        created_at: { type: string, format: date-time }

    JobStatusResponse:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, example: "matching" }
        status: { type: string, enum: [pending, running, completed, failed, cancelled], example: "completed" }
        attempts: { type: integer, example: 1 }
        error: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        result: { type: object, nullable: true }

    CandidateMatch:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string, nullable: true, example: "Bob" }
        age: { type: integer, nullable: true, example: 27 }
        gender: { type: string, nullable: true, example: "man" }
        orientation: { type: string, nullable: true, example: "heterosexual" }
        relationship_goal: { type: string, nullable: true, example: "long-term" }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        distance_km: { type: number, format: double, nullable: true, example: 8.5 }
        profile: { type: object }
        cosine_distance: { type: number, example: 0.1852 }
        cosine_similarity: { type: number, example: 0.8148 }
        reverse_cosine_distance: { type: number, nullable: true, example: 0.1920 }
        reverse_cosine_similarity: { type: number, nullable: true, example: 0.8080 }
        combined_score: { type: number, example: 0.8114 }
        compatibility_percentage: { type: integer, example: 75, description: "Normalized user-friendly match percentage from 0% to 99%" }

    RetrievalOptions:
      type: object
      properties:
        candidate_pool_limit: { type: integer, example: 50 }
        pre_rank_limit: { type: integer, example: 15 }
        max_distance_km: { type: integer, example: 100 }
        min_similarity_threshold: { type: number, example: 0.0 }
        bidirectional_weight: { type: number, example: 0.5 }
        require_mutual_age: { type: boolean, example: true }
        require_mutual_gender: { type: boolean, example: true }
        require_mutual_relationship_goal: { type: boolean, example: true }

    RetrievalListResponse:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        total_candidates: { type: integer, example: 5 }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateMatch'

    AnalyzeMatchRequest:
      type: object
      required: [candidate_user_id]
      properties:
        candidate_user_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, nullable: true }

    MatchCandidateResponse:
      type: object
      properties:
        id: { type: string, format: uuid, nullable: true }
        match_id: { type: string, format: uuid, nullable: true }
        user_a_id: { type: string, format: uuid, nullable: true }
        user_b_id: { type: string, format: uuid }
        user_b_name: { type: string, nullable: true, example: "Bob" }
        overall_verdict:
          type: string
          enum: [strong_alignment, partial_alignment, unclear, conflict]
          example: "strong_alignment"
        overall_reasoning:
          type: string
          example: "You both share a deep commitment to emotional openness and long-term personal growth."
        dimension_results:
          type: object
          description: Categorical verdicts and evidence quotes per dimension
        complementary_alignments:
          type: array
          items: { type: string }
        shared_alignments:
          type: array
          items: { type: string }
        strong_alignments:
          type: array
          items: { type: string }
        potential_conflicts:
          type: array
          items: { type: string }
        dealbreaker_violations:
          type: array
          items: { type: string }
        uncertainties:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    MatchesListResponse:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        total_matches: { type: integer, example: 1 }
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidateResponse'
